[workspace]
members = [
    "crates/kuroso_core",
    "crates/kuroso_ui",
    "src-bin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
smol_str = { version = "0.2", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
lofty = "0.21"
jwalk = "0.8"
rayon = "1.10"
notify-debouncer-mini = "0.4"
crossbeam-channel = "0.5"