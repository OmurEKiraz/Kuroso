[workspace]
resolver = "2"
members = [
    "crates/kuroso_core",
    "crates/kuroso_ui",
    "src-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL3.0"

[workspace.dependencies]
smol_str = { version = "0.2", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
jwalk = "0.8"
rayon = "1.10"